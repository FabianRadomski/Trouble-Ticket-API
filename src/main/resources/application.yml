spring:
  application:
    name: trouble-ticket-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/troubleticket}
    username: ${DB_USERNAME:troubleticket}
    password: ${DB_PASSWORD:troubleticket}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks that the
      # entities match it at startup.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # RS256 public key only (README §1). Locally: scripts/dev-keys.sh writes .dev/jwt-public.pem.
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:.dev/jwt-public.pem}
          jws-algorithms: RS256
  jackson:
    deserialization:
      # Spec: additionalProperties: false -> unknown JSON fields are a 400 (README §8).
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Request ID from RequestIdFilter (README §9) on every log line.
    correlation: "[%X{requestId:-}] "
