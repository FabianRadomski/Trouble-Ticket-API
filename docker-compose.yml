services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: troubleticket
      POSTGRES_USER: troubleticket
      POSTGRES_PASSWORD: troubleticket
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U troubleticket -d troubleticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/troubleticket
      DB_USERNAME: troubleticket
      DB_PASSWORD: troubleticket
      JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt-public.pem
    volumes:
      # Created by scripts/dev-keys.sh; run it before `docker compose up` (README "Running").
      - ./.dev/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    depends_on:
      - api
    ports:
      - "8081:8080"
    environment:
      SWAGGER_JSON: /spec/trouble-ticket-api.yaml
    volumes:
      - ./devtask:/spec:ro
      # Adds a /api/ proxy to the API so "Try it out" works same-origin (see the file's header).
      - ./docker/swagger-ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro

volumes:
  postgres-data:
